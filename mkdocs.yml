site_name: João Santos Portfolio
site_url: https://kronoustech.github.io/Portfolio-MkDocs/
site_description: Portfolio of João Santos, Unity Game Developer and AR/VR Engineer with 6+ years of shipping games and immersive experiences.
site_author: João Santos
repo_url: https://github.com/kronousTech/Portfolio-MkDocs
repo_name: kronousTech/Portfolio-MkDocs
edit_uri: ""
copyright: Copyright &copy; João Santos

extra_css:
  - stylesheets/slider.css
  - stylesheets/extra.css
extra_javascript:
  - javascripts/slider.js

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: green
      accent: deep purple
    # Light Mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: green
      accent: deep purple
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

plugins:
  - search
  - tags

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kronousTech
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/joão-santos-104182189
      name: LinkedIn
    - icon: simple/upwork
      link: https://www.upwork.com/freelancers/~0123e3d22d308b137c
      name: Upwork
    - icon: fontawesome/solid/envelope
      link: mailto:joaosantosprofi@protonmail.com
      name: Email

