site_name: João Santos Portfolio

extra_css:
- stylesheets/slider.css
extra_javascript:
- javascripts/slider.js

theme:
  name: material
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: green
      accent: deep purple
    # Light Mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
      primary: green
      accent: deep purple
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.code.line_numbers
    - search.suggest
    - search.highlight
  
